name: Daily security repairs

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      apply:
        description: Create and publish repairs that pass validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-security-repairs
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check activation
        env:
          SECURITY_BOT_TOKEN: ${{ secrets.SECURITY_BOT_TOKEN }}
        run: |
          if [ -z "$SECURITY_BOT_TOKEN" ]; then
            echo '::error::Add SECURITY_BOT_TOKEN to infrastructure Actions secrets to activate all-repository repairs.'
            exit 1
          fi
      - name: Test controller safeguards
        working-directory: security-bot
        run: python3 -m unittest -v
      - name: Scan, repair, test, publish, and validate again
        env:
          SECURITY_BOT_TOKEN: ${{ secrets.SECURITY_BOT_TOKEN }}
          APPLY_REPAIRS: ${{ github.event_name == 'schedule' || inputs.apply }}
        working-directory: security-bot
        run: |
          if [ "$APPLY_REPAIRS" = true ]; then
            python3 bot.py --apply
          else
            python3 bot.py
          fi
      - name: Save security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-security-report
          path: security-bot/security-report.json
          if-no-files-found: warn
          retention-days: 30
