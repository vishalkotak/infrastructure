# Template: replace the host and Secret URI after a cluster admin configures the
# Substrate credential provider and authorizes this atespace for the Secret namespace.
# Use read-only credentials scoped to the upstream and selected consumers. A Kubernetes
# Secret is static: it does not issue or rotate short-lived GitHub App tokens.
# The CLI mounts Substrate's MITM and system-root trust bundles for HTTPS interception.
rules:
  - https:
      hostnames: [github.example.com]
      effects:
        replaceHeaders:
          - header: Authorization
            prefix: "Bearer "
            credentialUri: ate-secret://k8s.io/default/REPLACE_NAMESPACE/REPLACE_SECRET/token
  - tlsPassthrough:
      hostnames:
        - crates.io
        - index.crates.io
        - static.crates.io
        - pypi.org
        - files.pythonhosted.org
      ports:
        numbers: [443]
