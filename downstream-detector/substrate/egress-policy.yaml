# Apply to a specific actor that needs GitHub source and crates.io downloads.
# The comparison still runs inside the actor's sandbox.
rules:
  - tlsPassthrough:
      hostnames:
        - crates.io
        - index.crates.io
        - static.crates.io
        - pypi.org
        - files.pythonhosted.org
        - github.com
      ports:
        numbers: [443]
